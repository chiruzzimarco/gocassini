server {
  listen 80;
  root /usr/share/nginx/html;
  index codec.html;

  # Meetings are Ogg Opus; serve them as audio (nginx answers Range requests,
  # which the player needs to seek).
  location ~* \.opus$ {
    types { }
    default_type audio/ogg;
  }

  # The list changes whenever a meeting is added.
  location = /catalog.json {
    add_header Cache-Control "no-store";
  }
}
