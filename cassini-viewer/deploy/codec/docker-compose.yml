# The codec as a password-protected site behind an existing Traefik (Docker
# provider on the external `traefik-public` network, ACME resolver
# `myresolver`). Copy the built site (vite.codec.config.ts → dist/codec) into
# ./site, then set CODEC_HOST and CODEC_AUTH_USERS in .env (see .env.example).
services:
  codec:
    image: nginx:1.27-alpine
    container_name: codec
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.codec.rule=Host(`${CODEC_HOST}`)
      - traefik.http.routers.codec.entrypoints=websecure
      - traefik.http.routers.codec.tls=true
      - traefik.http.routers.codec.tls.certresolver=myresolver
      - traefik.http.routers.codec.middlewares=codec-auth
      - traefik.http.middlewares.codec-auth.basicauth.users=${CODEC_AUTH_USERS}
      - traefik.http.services.codec.loadbalancer.server.port=80

  # Dropped .opus files: stored in ./site/meetings and added to catalog.json.
  codec-upload:
    image: python:3.12-alpine
    container_name: codec-upload
    restart: unless-stopped
    user: "${CODEC_UID:-1000}:${CODEC_GID:-1000}"
    command: ["python", "-u", "/app/upload.py"]
    volumes:
      - ./site:/site
      - ./upload.py:/app/upload.py:ro
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.codec-upload.rule=Host(`${CODEC_HOST}`) && PathPrefix(`/api/`)
      - traefik.http.routers.codec-upload.priority=100
      - traefik.http.routers.codec-upload.entrypoints=websecure
      - traefik.http.routers.codec-upload.tls=true
      - traefik.http.routers.codec-upload.tls.certresolver=myresolver
      - traefik.http.routers.codec-upload.middlewares=codec-auth
      - traefik.http.services.codec-upload.loadbalancer.server.port=8000

networks:
  traefik-public:
    external: true
